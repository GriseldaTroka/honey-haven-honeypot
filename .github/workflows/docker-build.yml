name: Build and optionally push Docker images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry (if provided)
        if: secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
      - name: Build and tag image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/honeyhaven/web:latest
            ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/honeyhaven/web:${{ github.sha }}
      - name: Push images (optional)
        if: secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/honeyhaven/web:${{ github.sha }}
