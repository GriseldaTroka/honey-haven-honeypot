name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: honey
          POSTGRES_USER: honey
          POSTGRES_PASSWORD: honey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honey" --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: honeytrap.settings
        run: |
          python manage.py migrate --noinput
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: honeytrap.settings
        run: |
          python manage.py test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8
      - name: Black (format check)
        run: |
          black --check .
      - name: Flake8
        run: |
          flake8 .

  deps-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Verify dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --version || true
          pip-audit -r requirements.txt || true
